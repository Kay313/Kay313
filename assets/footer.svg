<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="1000" height="130" role="img" aria-label="MegaBuild.de">
  <title>MegaBuild.de</title>

  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#170d29"/>
      <stop offset="50%"  stop-color="#22153a"/>
      <stop offset="100%" stop-color="#170d29"/>
    </linearGradient>

    <linearGradient id="fword" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c985ff">
        <animate attributeName="stop-color" values="#c985ff;#ff91e9;#a958ff;#c985ff" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#ff91e9">
        <animate attributeName="stop-color" values="#ff91e9;#a958ff;#c985ff;#ff91e9" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#a958ff">
        <animate attributeName="stop-color" values="#a958ff;#c985ff;#ff91e9;#a958ff" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="fstrip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#170d29"/>
      <stop offset="35%"  stop-color="#a958ff"/>
      <stop offset="65%"  stop-color="#ff91e9"/>
      <stop offset="100%" stop-color="#170d29"/>
    </linearGradient>

    <filter id="fsoft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>

    <clipPath id="fcard">
      <rect x="1" y="1" width="998" height="128" rx="20"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="998" height="128" rx="20" fill="url(#fbg)"/>

  <g clip-path="url(#fcard)">
    <g filter="url(#fsoft)" opacity="0.5">
      <circle cx="300" cy="130" r="70" fill="#a958ff">
        <animateTransform attributeName="transform" type="translate"
                          values="0,0; 80,-20; 0,0" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle cx="700" cy="0" r="70" fill="#ff91e9">
        <animateTransform attributeName="transform" type="translate"
                          values="0,0; -70,30; 0,0" dur="19s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="503" y="58" text-anchor="middle"
          font-family="Geist, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="24" font-weight="700" letter-spacing="6" fill="url(#fword)">MEGABUILD.DE</text>

    <text x="501.5" y="84" text-anchor="middle"
          font-family="Geist, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="11.5" font-weight="600" letter-spacing="3" fill="#ab9dc0">GITHUB.COM/KAY313</text>

    <g>
      <rect x="480" y="99" width="8" height="8" rx="2" fill="#c985ff">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" repeatCount="indefinite" begin="0s"/>
      </rect>
      <rect x="496" y="99" width="8" height="8" rx="2" fill="#ff91e9">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" repeatCount="indefinite" begin="0.4s"/>
      </rect>
      <rect x="512" y="99" width="8" height="8" rx="2" fill="#a958ff">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" repeatCount="indefinite" begin="0.8s"/>
      </rect>
    </g>

    <rect x="0" y="0" width="1000" height="4" fill="url(#fstrip)"/>
  </g>

  <rect x="1" y="1" width="998" height="128" rx="20" fill="none" stroke="#d3b0ff" stroke-opacity="0.18" stroke-width="1.5"/>
</svg>
