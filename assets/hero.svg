<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Kay313 - Backend and Infrastructure Engineer">
  <title>Kay313 — Backend &amp; Infrastructure Engineer</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#170d29"/>
      <stop offset="52%" stop-color="#22153a"/>
      <stop offset="100%" stop-color="#170d29"/>
    </linearGradient>

    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c985ff">
        <animate attributeName="stop-color" values="#c985ff;#ff91e9;#a958ff;#c985ff" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#ff91e9">
        <animate attributeName="stop-color" values="#ff91e9;#a958ff;#c985ff;#ff91e9" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#a958ff">
        <animate attributeName="stop-color" values="#a958ff;#c985ff;#ff91e9;#a958ff" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#170d29"/>
      <stop offset="30%" stop-color="#a958ff"/>
      <stop offset="60%" stop-color="#ff91e9"/>
      <stop offset="100%" stop-color="#170d29"/>
    </linearGradient>

    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#c985ff" stroke-width="1" opacity="0.055"/>
    </pattern>

    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>

    <clipPath id="card">
      <rect x="1" y="1" width="998" height="298" rx="22"/>
    </clipPath>

    <clipPath id="typeclip">
      <rect x="64" y="186" width="0" height="30">
        <animate attributeName="width"
                 values="0;0;350;350;0;0"
                 keyTimes="0;0.05;0.45;0.90;0.97;1"
                 dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="998" height="298" rx="22" fill="url(#bg)"/>

  <g clip-path="url(#card)">
    <!-- ambient orbs -->
    <g filter="url(#soft)" opacity="0.55">
      <circle cx="180" cy="60" r="90" fill="#a958ff">
        <animateTransform attributeName="transform" type="translate"
                          values="0,0; 70,40; -20,20; 0,0" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle cx="860" cy="250" r="105" fill="#ff91e9" opacity="0.75">
        <animateTransform attributeName="transform" type="translate"
                          values="0,0; -60,-45; 30,-15; 0,0" dur="22s" repeatCount="indefinite"/>
      </circle>
      <circle cx="520" cy="330" r="80" fill="#c985ff" opacity="0.6">
        <animateTransform attributeName="transform" type="translate"
                          values="0,0; 40,-60; -40,-20; 0,0" dur="26s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- voxel grid -->
    <rect x="0" y="0" width="1000" height="300" fill="url(#grid)"/>

    <!-- floating blocks -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-11; 0,0"
                        dur="6.5s" repeatCount="indefinite" keyTimes="0;0.5;1"
                        calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <g transform="translate(848,116)">
        <polygon points="0,-34 29.4,-17 0,0 -29.4,-17" fill="#c985ff"/>
        <polygon points="-29.4,-17 0,0 0,34 -29.4,17" fill="#54357f"/>
        <polygon points="29.4,-17 0,0 0,34 29.4,17" fill="#a958ff"/>
      </g>
    </g>

    <g opacity="0.85">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,9; 0,0"
                        dur="8.5s" repeatCount="indefinite" keyTimes="0;0.5;1"
                        calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <g transform="translate(766,182) scale(0.72)">
        <polygon points="0,-34 29.4,-17 0,0 -29.4,-17" fill="#ff91e9"/>
        <polygon points="-29.4,-17 0,0 0,34 -29.4,17" fill="#63307a"/>
        <polygon points="29.4,-17 0,0 0,34 29.4,17" fill="#c064c9"/>
      </g>
    </g>

    <g opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-7; 0,0"
                        dur="10s" repeatCount="indefinite" keyTimes="0;0.5;1"
                        calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <g transform="translate(916,206) scale(0.55)">
        <polygon points="0,-34 29.4,-17 0,0 -29.4,-17" fill="#c985ff"/>
        <polygon points="-29.4,-17 0,0 0,34 -29.4,17" fill="#54357f"/>
        <polygon points="29.4,-17 0,0 0,34 29.4,17" fill="#a958ff"/>
      </g>
    </g>

    <!-- eyebrow: live dot + domain -->
    <circle cx="70" cy="74" r="4" fill="#8cffb8"/>
    <circle cx="70" cy="74" r="4" fill="none" stroke="#8cffb8" stroke-width="1.5">
      <animate attributeName="r" values="4;13" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="86" y="79" font-family="Geist, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="14" font-weight="600" letter-spacing="3.2" fill="#ab9dc0">MEGABUILD.DE</text>

    <!-- name -->
    <text x="64" y="164" font-family="Geist, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="72" font-weight="700" letter-spacing="-1.5" fill="url(#name)">Kay313</text>

    <!-- typed line -->
    <g clip-path="url(#typeclip)">
      <text x="64" y="208" font-family="Geist, 'Segoe UI', Inter, system-ui, sans-serif"
            font-size="22" font-weight="500" fill="#ddd2ee">Backend &amp; Infrastructure Engineer</text>
    </g>
    <rect y="187" width="2.5" height="26" fill="#ff91e9">
      <animate attributeName="x"
               values="64;64;414;414;64;64"
               keyTimes="0;0.05;0.45;0.90;0.97;1"
               dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>

    <!-- stack line -->
    <text x="64" y="246" font-family="Geist, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="14.5" font-weight="500" letter-spacing="1.4" fill="#ab9dc0">Java  ·  Velocity &amp; CloudNet  ·  MariaDB  ·  TypeScript  ·  Linux</text>

    <!-- brand strip -->
    <rect x="0" y="296" width="1000" height="4" fill="url(#strip)"/>
  </g>

  <rect x="1" y="1" width="998" height="298" rx="22" fill="none" stroke="#d3b0ff" stroke-opacity="0.18" stroke-width="1.5"/>
</svg>
